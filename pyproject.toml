[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-predictive-maintenance"
version = "0.1.0"
description = "Bearing Remaining Useful Life Prediction & Maintenance Decision System"
readme = "README.md"
authors = [
    { name = "Lead Data Engineer" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
